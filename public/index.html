<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Volkswagen Caffè | Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05080d;
      --gold: #d4af37;
      --gold-light: #f4e4a6;
      --gold-dark: #997a00;
      --cream: #fdfbf7;
      --muted: #6b7a8f;
      --glass: rgba(255, 255, 255, 0.03);
      --border: rgba(212, 175, 55, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg);
      color: var(--cream);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* Background Effects */
    .bg-grid {
      position: fixed; inset: 0;
      background-image: linear-gradient(rgba(212, 175, 55, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(212, 175, 55, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none; z-index: 0;
      mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
    }
    .bg-glow {
      position: fixed; inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
      animation: bgPulse 6s ease-in-out infinite alternate;
    }
    @keyframes bgPulse {
      0% { opacity: 0.5; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    /* ============ LOADER WITH YOUR LOGO ============ */
    #loader {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 1s ease, visibility 1s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; }

    .loader-logo-container {
      width: 280px; height: 280px;
      display: flex; align-items: center; justify-content: center;
      animation: logoPulse 3s ease-in-out infinite;
      position: relative;
    }
    .loader-logo-img {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.5)) drop-shadow(0 0 50px rgba(212, 175, 55, 0.2));
    }
    @keyframes logoPulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    .loader-sub {
      margin-top: 20px; font-family: 'Montserrat', sans-serif; font-size: 11px;
      letter-spacing: 8px; color: var(--gold); text-transform: uppercase;
      animation: fadeInOut 2s ease-in-out infinite;
    }
    @keyframes fadeInOut { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    /* ============ HERO ============ */
    .hero {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 40px 20px; position: relative; z-index: 1; overflow: hidden;
    }
    .hero::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 200px; background: linear-gradient(to top, var(--bg), transparent); pointer-events: none; }
    .hero-logo {
      width: 80px; height: 80px; border: 2px solid var(--gold); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; margin-bottom: 30px;
      font-family: 'Cinzel', serif; font-size: 32px; color: var(--gold); font-weight: 900;
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.2), inset 0 0 20px rgba(212, 175, 55, 0.1);
      animation: heroFloat 4s ease-in-out infinite; position: relative;
    }
    .hero-logo::before { content: ''; position: absolute; inset: -10px; border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 50%; animation: spinSlow 10s linear infinite; }
    @keyframes heroFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes spinSlow { 100% { transform: rotate(360deg); } }
    .hero h1 {
      font-family: 'Cinzel', serif; font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 900; letter-spacing: 4px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 10px; filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.3));
      animation: heroReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes heroReveal { from { opacity: 0; transform: translateY(30px) scale(0.9); filter: blur(10px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
    .hero .est { font-size: 12px; letter-spacing: 12px; color: var(--muted); text-transform: uppercase; margin-bottom: 30px; animation: heroReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both; }
    .hero .divider { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 0 auto 30px; animation: heroReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
    .hero .slogan { font-family: 'Montserrat', sans-serif; font-size: clamp(0.8rem, 3vw, 1.1rem); font-weight: 300; letter-spacing: 3px; color: var(--cream); opacity: 0.8; animation: heroReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
    .scroll-hint { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--muted); font-size: 10px; letter-spacing: 4px; text-transform: uppercase; animation: heroReveal 1.2s ease 1s both; }
    .scroll-hint .line { width: 1px; height: 40px; background: linear-gradient(to bottom, var(--gold), transparent); animation: scrollLine 2s ease-in-out infinite; }
    @keyframes scrollLine { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 50.1% { transform: scaleY(1); transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }

    /* ============ GALLERY ============ */
    .gallery-section { position: relative; z-index: 1; padding: 20px 0 40px; animation: heroReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both; }
    .gallery-header { text-align: center; margin-bottom: 25px; }
    .gallery-header h2 { font-family: 'Cinzel', serif; font-size: 1.8rem; color: var(--gold); letter-spacing: 3px; text-shadow: 0 0 20px rgba(212, 175, 55, 0.2); margin-bottom: 10px; }
    .gallery-header .ornament { display: flex; align-items: center; justify-content: center; gap: 15px; color: var(--gold); opacity: 0.5; }
    .gallery-header .ornament .line { width: 30px; height: 1px; background: var(--gold); }
    .gallery-header .ornament .diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
    .gallery-scroll { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 16px; padding: 10px 20px 20px; scrollbar-width: none; -ms-overflow-style: none; }
    .gallery-scroll::-webkit-scrollbar { display: none; }
    .gallery-item { flex: 0 0 78%; scroll-snap-align: center; border-radius: 20px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(212, 175, 55, 0.1); position: relative; transition: transform 0.4s ease, box-shadow 0.4s ease; }
    .gallery-item:active { transform: scale(0.97); box-shadow: 0 5px 15px rgba(0, 0, 0, 0.8); }
    .gallery-item img { width: 100%; height: 220px; object-fit: cover; display: block; transition: transform 0.6s ease; }
    .gallery-item:active img { transform: scale(1.05); }

    /* ============ FLOATING NAV ============ */
    .nav-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 600px; z-index: 1000; animation: navSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; }
    @keyframes navSlideUp { from { opacity: 0; transform: translate(-50%, 40px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .nav-inner { display: flex; gap: 8px; padding: 10px 15px; background: rgba(10, 15, 24, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 40px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(212, 175, 55, 0.1); overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; scroll-snap-type: x mandatory; }
    .nav-inner::-webkit-scrollbar { display: none; }
    .nav-btn { flex: 0 0 auto; background: transparent; border: none; color: var(--muted); padding: 10px 18px; border-radius: 30px; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; scroll-snap-align: center; position: relative; white-space: nowrap; }
    .nav-btn.active { color: var(--bg); background: linear-gradient(135deg, var(--gold-light), var(--gold)); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
    .nav-btn:not(.active):hover { color: var(--gold); }

    /* ============ MENU SECTIONS ============ */
    main { max-width: 800px; margin: 0 auto; padding: 0 20px 150px; position: relative; z-index: 1; }
    .category { margin-bottom: 80px; padding-top: 40px; }
    .category-header { text-align: center; margin-bottom: 40px; position: relative; }
    .category-header h2 { font-family: 'Cinzel', serif; font-size: clamp(1.8rem, 5vw, 2.5rem); font-weight: 700; color: var(--gold); letter-spacing: 3px; margin-bottom: 15px; text-shadow: 0 0 30px rgba(212, 175, 55, 0.2); }
    .category-header .ornament { display: flex; align-items: center; justify-content: center; gap: 15px; color: var(--gold); opacity: 0.5; }
    .category-header .ornament .line { width: 40px; height: 1px; background: var(--gold); }
    .category-header .ornament .diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
    .items-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }

    /* ============ MENU ITEM ============ */
    .item { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; background: var(--glass); border: 1px solid var(--border); border-radius: 16px; position: relative; overflow: hidden; opacity: 0; transform: translateY(30px); transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, background 0.3s ease; }
    .item.visible { opacity: 1; transform: translateY(0); }
    .item::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: linear-gradient(to bottom, var(--gold), var(--gold-dark)); transform: scaleY(0); transform-origin: top; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .item:active { transform: scale(0.98); background: rgba(212, 175, 55, 0.05); border-color: rgba(212, 175, 55, 0.4); }
    .item:active::before { transform: scaleY(1); }
    .item-name { font-family: 'Montserrat', sans-serif; font-size: 0.95rem; font-weight: 400; letter-spacing: 0.5px; color: var(--cream); transition: color 0.3s ease; }
    .item-price { font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 700; color: var(--gold); position: relative; padding-left: 20px; transition: all 0.3s ease; }
    .item-price::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 6px; height: 1px; background: var(--gold); opacity: 0.4; }

    /* ============ FOOTER ============ */
    footer { text-align: center; padding: 80px 20px 200px; position: relative; z-index: 1; }
    footer .footer-logo { font-family: 'Cinzel', serif; font-size: 24px; color: var(--gold); letter-spacing: 4px; margin-bottom: 20px; opacity: 0.6; }
    footer .footer-text { font-size: 10px; letter-spacing: 6px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    footer .footer-line { width: 40px; height: 1px; background: var(--gold); margin: 20px auto; opacity: 0.3; }

    @media (min-width: 600px) { .items-grid { grid-template-columns: 1fr 1fr; } .nav-btn { font-size: 12px; padding: 12px 22px; } .gallery-item { flex: 0 0 45%; } .gallery-item img { height: 280px; } }
    @media (max-width: 400px) { .item { padding: 14px 18px; } .item-name { font-size: 0.85rem; } .item-price { font-size: 1rem; } }
  </style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <!-- ============ LOADER WITH YOUR LOGO ============ -->
  <!-- Make sure to save your logo image as "logo.png" in the same folder as this file -->
  <div id="loader">
    <div class="loader-logo-container">
      <img src="logo.png" alt="Volkswagen Caffè Logo" class="loader-logo-img">
    </div>
    <div class="loader-sub">Let's Take a Coffee Break</div>
  </div>

  <!-- ============ HERO ============ -->
  <section class="hero">
    <div class="hero-logo">VW</div>
    <h1>Volkswagen Caffè</h1>
    <div class="est">Est. 1937</div>
    <div class="divider"></div>
    <div class="slogan">Driven by Coffee, Fueled by Passion.</div>
    <div class="scroll-hint">
      <span>Scroll</span>
      <div class="line"></div>
    </div>
  </section>

  <!-- ============ GALLERY ============ -->
  <!-- Replace the src="..." with your actual photo filenames -->
  <section class="gallery-section">
    <div class="gallery-header">
      <h2>The Atmosphere</h2>
      <div class="ornament">
        <div class="line"></div>
        <div class="diamond"></div>
        <div class="line"></div>
      </div>
    </div>
    <div class="gallery-scroll">
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?q=80&w=800&auto=format&fit=crop" alt="Cafe Interior">
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1497935586351-b67a49e012bf?q=80&w=800&auto=format&fit=crop" alt="Coffee Cup">
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?q=80&w=800&auto=format&fit=crop" alt="Coffee Beans">
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1445116572660-236099ec97a0?q=80&w=800&auto=format&fit=crop" alt="Cafe Vibe">
      </div>
    </div>
  </section>

  <!-- ============ MENU ============ -->
  <main id="menu-container"></main>

  <!-- ============ FOOTER ============ -->
  <footer>
    <div class="footer-logo">VW</div>
    <div class="footer-text">Good Coffee | Good Mood | Good Day</div>
    <div class="footer-line"></div>
    <div class="footer-text">Enjoy Your Time</div>
  </footer>

  <!-- ============ FLOATING NAV ============ -->
  <div class="nav-container">
    <div class="nav-inner" id="nav-inner"></div>
  </div>

  <script>
    // ============ MENU DATA (Exact Names) ============
    const menuData = [
      { id: 'coffee', title: 'Coffee', items: [
        { n: 'Ristretto', p: 2500 }, { n: 'Espresso', p: 3000 }, { n: 'Lungo', p: 3000 },
        { n: 'Double Espresso', p: 4000 }, { n: 'Americano', p: 3000 }, { n: 'Espresso Macchiato', p: 3000 },
        { n: 'Cortado', p: 3500 }, { n: 'Latte', p: 3500 }, { n: 'Caramel Latte', p: 4000 },
        { n: 'Spanish Latte', p: 4000 }, { n: 'Mocha', p: 4000 }, { n: 'Cappuccino', p: 3500 },
        { n: 'Hot Chocolate', p: 3000 }, { n: 'Nescafe', p: 3000 }, { n: 'Qazwan', p: 2500 },
        { n: 'Turkish Coffee', p: 2500 }, { n: 'Arabic Coffee', p: 2500 }, { n: 'Green Tea', p: 1000 },
        { n: 'Black Tea', p: 1000 }, { n: 'EXSTRA SHOT', p: 1000 }
      ]},
      { id: 'mojito', title: 'Mojito', items: [
        { n: 'Virgin Mojito', p: 3500 }, { n: 'Blue Mojito', p: 3500 }, { n: 'Red Mojito', p: 3500 },
        { n: 'Blueberry Mojito', p: 3500 }, { n: 'Black Mojito', p: 3500 }, { n: 'Special Mochtail', p: 5000 }
      ]},
      { id: 'milkshake', title: 'Milkshake', items: [
        { n: 'Milkshake Vanilla', p: 3000 }, { n: 'Milkshake Caramel', p: 4000 }, { n: 'Milkshake Banana', p: 3500 },
        { n: 'Milkshake Strawberry', p: 3500 }, { n: 'Milkshake Blueberries', p: 3500 }, { n: 'Milkshake Chocolate', p: 4000 },
        { n: 'Milkshake Oreo', p: 4000 }, { n: 'Milkshake Lotus', p: 4000 }, { n: 'Milkshake Nutella', p: 4000 },
        { n: 'Milkshake Kinder', p: 4000 }
      ]},
      { id: 'fresh-juice', title: 'Fresh Juice', items: [
        { n: 'Banana', p: 3500 }, { n: 'Strawberry', p: 4000 }, { n: 'Orange', p: 3000 },
        { n: 'Lemon', p: 3000 }, { n: 'Lemon & Mint', p: 3000 }
      ]},
      { id: 'crepes', title: 'Crepes', items: [
        { n: 'Simple Crepe', p: 3000 }, { n: 'Fruit Crepe', p: 3000 }, { n: 'Oreo Crepe', p: 3000 },
        { n: 'Lotus Crepe', p: 3000 }, { n: 'Mix Crepe', p: 5000 }
      ]},
      { id: 'pancakes', title: 'Mini Pancakes', items: [
        { n: 'Simple Mini Pancakes', p: 2500 }, { n: 'Fruit Mini Pancakes', p: 3000 }, { n: 'Oreo Mini Pancakes', p: 3500 },
        { n: 'Lotus Mini Pancakes', p: 3500 }, { n: 'Mix Mini Pancakes', p: 4500 }
      ]},
      { id: 'iced-coffee', title: 'Iced Coffee', items: [
        { n: 'Ice Coffee', p: 3000 }, { n: 'Ice Latte', p: 3500 }, { n: 'Ice Cappuccino', p: 3500 },
        { n: 'Affogato', p: 4000 }, { n: 'Ice Caramel Latte', p: 4500 }, { n: 'Ice Spanish Latte', p: 4500 },
        { n: 'Ice Mocha', p: 4500 }, { n: 'Ice Americano', p: 3500 }, { n: 'Ice Long Black', p: 4500 },
        { n: 'Espresso Orange', p: 6000 }, { n: 'Frappe', p: 3500 }, { n: 'Caramel Frappe', p: 3500 },
        { n: 'Frappuccino', p: 4000 }, { n: 'Fredo Espresso', p: 3000 }
      ]},
      { id: 'smoothie', title: 'Smoothie', items: [
        { n: 'Smoothie Strawberry', p: 3500 }, { n: 'Smoothie Strawberry & Banana', p: 4000 }, { n: 'Smoothie Blueberries', p: 3500 }
      ]},
      { id: 'special', title: 'Special Drinks', items: [
        { n: 'Mexican Tiger', p: 3500 }, { n: 'Mexican Redbull', p: 5000 }
      ]},
      { id: 'cold', title: 'Cold Drinks', items: [
        { n: 'Water', p: 250 }, { n: 'Soda', p: 500 }, { n: 'Sardi', p: 500 },
        { n: 'Tiger', p: 1500 }, { n: 'Redbull', p: 2500 }
      ]}
    ];

    // ============ RENDER MENU ============
    const container = document.getElementById('menu-container');
    const navInner = document.getElementById('nav-inner');

    menuData.forEach((cat, index) => {
      const section = document.createElement('section');
      section.className = 'category';
      section.id = cat.id;

      const itemsHTML = cat.items.map(item => `
        <div class="item">
          <span class="item-name">${item.n}</span>
          <span class="item-price">${item.p}</span>
        </div>
      `).join('');

      section.innerHTML = `
        <div class="category-header">
          <h2>${cat.title}</h2>
          <div class="ornament">
            <div class="line"></div>
            <div class="diamond"></div>
            <div class="line"></div>
          </div>
        </div>
        <div class="items-grid">${itemsHTML}</div>
      `;
      container.appendChild(section);

      const btn = document.createElement('button');
      btn.className = 'nav-btn';
      btn.textContent = cat.title;
      btn.dataset.target = cat.id;
      btn.addEventListener('click', () => {
        document.getElementById(cat.id).scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      navInner.appendChild(btn);
    });

    // ============ LOADER HIDE ============
    window.addEventListener('load', () => {
      setTimeout(() => { document.getElementById('loader').classList.add('hidden'); }, 2500);
    });

    // ============ SCROLL ANIMATIONS ============
    const observerOptions = { threshold: 0.1, rootMargin: '0px 0px -50px 0px' };
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, observerOptions);

    document.querySelectorAll('.item').forEach((item, i) => {
      item.style.transitionDelay = `${(i % 10) * 0.05}s`;
      observer.observe(item);
    });

    // ============ SCROLL SPY NAV ============
    const navButtons = document.querySelectorAll('.nav-btn');
    const sections = document.querySelectorAll('.category');

    const scrollSpy = () => {
      let current = '';
      const scrollPos = window.scrollY + window.innerHeight / 3;

      sections.forEach(section => {
        if (scrollPos >= section.offsetTop) current = section.getAttribute('id');
      });

      navButtons.forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.target === current) {
          btn.classList.add('active');
          const btnLeft = btn.offsetLeft;
          const btnWidth = btn.offsetWidth;
          const navWidth = navInner.offsetWidth;
          navInner.scrollTo({ left: btnLeft - (navWidth / 2) + (btnWidth / 2), behavior: 'smooth' });
        }
      });
    };

    window.addEventListener('scroll', scrollSpy, { passive: true });
    scrollSpy();

    // ============ PARALLAX HERO ============
    window.addEventListener('scroll', () => {
      const hero = document.querySelector('.hero');
      const scrolled = window.scrollY;
      if (scrolled < window.innerHeight) {
        hero.style.transform = `translateY(${scrolled * 0.3}px)`;
        hero.style.opacity = 1 - (scrolled / (window.innerHeight * 0.8));
      }
    }, { passive: true });
  </script>
</body>
</html>
